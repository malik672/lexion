[package]
name = "lexion"
version = "0.1.0"
edition = "2024"

[features]
default = ["tycho"]
tycho = [
    "dep:alloy",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tycho-simulation",
    "dep:tycho-execution",
]

[dependencies]
alloy-primitives = "1.7.3"
alloy = { version = "1", features = ["sol-types"], optional = true }
arc-swap = "1.7.1"
num-bigint = "0.4.6"
num-traits = "0.2.19"
smallvec = "1.16.1"
reqwest = { version = "0.12", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
tokio-stream = { version = "0.1.18", optional = true }
tycho-simulation = { version = "=0.372.0", default-features = false, features = ["evm"], optional = true }
tycho-execution = { version = "=0.372.0", optional = true }

[[bin]]
name = "live-smoke"
path = "src/bin/live_smoke.rs"
required-features = ["tycho"]

[[bin]]
name = "parity-original"
path = "src/bin/parity_original.rs"
required-features = ["tycho"]
